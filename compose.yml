services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/symfony
    command: sh -c 'composer install --no-interaction --prefer-dist --no-progress && exec apache2-foreground'
    volumes:
      - .:/app
      - ./symfony/vendor:/app/symfony/vendor
      - app_var:/app/symfony/var
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      APP_SECRET: ${APP_SECRET:-dev_only_change_me}
      DEFAULT_URI: http://eda.local
      DATABASE_URL: postgresql://orders:${POSTGRES_PASSWORD}@postgres:5432/orders?serverVersion=18&charset=utf8
      KAFKA_BROKERS: kafka:9092
    networks:
      - frontend
      - backend
    labels:
      - traefik.enable=true
      - traefik.docker.network=reverse-proxy
      - traefik.http.routers.eda.rule=Host(`eda.local`)
      - traefik.http.routers.eda.entrypoints=web
      - traefik.http.services.eda.loadbalancer.server.port=80

  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - backend

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend

  sqitch:
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: orders
      PGUSER: orders
      PGPASSWORD: ${POSTGRES_PASSWORD}
    image: local/sqitch:v1.6.1
    working_dir: /repo/db
    volumes:
      - .:/repo
    networks:
      - backend

volumes:
  app_vendor:
  app_var:
  postgres_data:

networks:
  frontend:
    external: true
    name: reverse-proxy
  backend:
    driver: bridge
    internal: true
